<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Image Compressor - Reduce Photo Size Online, No Upload</title>
<meta name="description" content="Compress JPG, PNG and WebP images in your browser. Free, private, no signup. Your photos never leave your device.">
<style>
:root{--ink:#1d2b2a;--bg:#e8eeec;--accent:#0f766e;--line:#cfd9d6;--muted:#5d6f6c}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.5}
header,main,footer{max-width:820px;margin:0 auto;padding:0 20px}
header{padding-top:28px}
h1{font-size:1.8rem;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
main{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;margin:16px auto 24px}
.drop{border:2px dashed var(--accent);border-radius:6px;padding:36px 16px;text-align:center;cursor:pointer;color:var(--accent);font-weight:bold}
.drop.over{background:#e6f4f1}
.drop:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:18px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
select,input[type=number]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px}
input[type=range]{width:100%}
.item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:10px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:3px;background:#eee}
.item .info{flex:1;min-width:0;font-size:.9rem}
.item .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save{color:var(--accent);font-weight:bold}
.btn{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:4px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;white-space:nowrap}
footer{color:var(--muted);font-size:.9rem;padding-bottom:40px}
footer a{color:var(--accent);margin-right:14px}
@media(max-width:640px){main{padding:18px}.item{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
<h1>Free Image Compressor</h1>
<p>Make photos smaller in one step. Your images never leave your device.</p>
</header>

<main>
<div class="drop" id="drop" tabindex="0" role="button">Click here or drop images (JPG, PNG, WebP)</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="opts">
<div><label for="q">Quality: <span id="qv">70</span>%</label><input type="range" id="q" min="10" max="95" value="70"></div>
<div><label for="fmt">Output format</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/webp">WebP (smallest)</option></select></div>
<div><label for="mw">Max width in pixels (optional)</label><input type="number" id="mw" min="100" placeholder="e.g. 1600"></div>
</div>

<div id="list"></div>
</main>

<footer>
<a href="./">Invoice generator</a><a href="qr.html">QR code generator</a><a href="wordcount.html">Word counter</a>
</footer>

<script>
var $=function(i){return document.getElementById(i)};
var files=[];
function kb(b){return b>1048576?(b/1048576).toFixed(2)+' MB':Math.round(b/1024)+' KB'}
$('q').oninput=function(){$('qv').textContent=this.value;run()};
$('fmt').onchange=run;$('mw').oninput=run;
$('drop').onclick=function(){$('file').click()};
$('drop').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('drop').ondragover=function(e){e.preventDefault();this.classList.add('over')};
$('drop').ondragleave=function(){this.classList.remove('over')};
$('drop').ondrop=function(e){e.preventDefault();this.classList.remove('over');add(e.dataTransfer.files)};
$('file').onchange=function(){add(this.files);this.value=''};
function add(fl){
for(var i=0;i<fl.length;i++){if(fl[i].type.indexOf('image/')===0)files.push(fl[i])}
run();
}
function compress(f,cb){
var img=new Image(),url=URL.createObjectURL(f);
img.onload=function(){
var w=img.width,h=img.height,mw=parseInt($('mw').value,10);
if(mw&&w>mw){h=Math.round(h*mw/w);w=mw}
var c=document.createElement('canvas');c.width=w;c.height=h;
var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
c.toBlob(function(b){URL.revokeObjectURL(url);cb(b)},$('fmt').value,parseInt($('q').value,10)/100);
};
img.onerror=function(){cb(null)};
img.src=url;
}
function run(){
var list=$('list');list.innerHTML='';
files.forEach(function(f){
var d=document.createElement('div');d.className='item';
d.innerHTML='<img alt=""><div class="info"><b></b><span>Compressing...</span></div>';
d.querySelector('b').textContent=f.name;
list.appendChild(d);
compress(f,function(b){
var info=d.querySelector('.info span');
if(!b){info.textContent='Could not read this image.';return}
d.querySelector('img').src=URL.createObjectURL(b);
var pct=Math.round((1-b.size/f.size)*100);
info.innerHTML=kb(f.size)+' to '+kb(b.size)+' <span class="save">'+(pct>0?'(-'+pct+'%)':'(no saving, try lower quality)')+'</span>';
var a=document.createElement('a');a.className='btn';a.textContent='Download';
a.href=URL.createObjectURL(b);
a.download=f.name.replace(/\.[^.]+$/,'')+'-compressed.'+($('fmt').value==='image/webp'?'webp':'jpg');
d.appendChild(a);
});
});
}
</script>
</body>
</html>

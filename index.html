<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Invoice Generator for Freelancers - No Signup</title>
<meta name="description" content="Create a professional invoice in seconds. Free, no signup. Add items, taxes and download as PDF.">
<style>
:root{--ink:#1d2b2a;--paper:#fff;--bg:#e8eeec;--accent:#0f766e;--line:#cfd9d6;--muted:#5d6f6c}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{max-width:820px;margin:0 auto;padding:28px 20px 8px}
h1{font-size:1.8rem;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
.sheet{max-width:820px;margin:16px auto 40px;background:var(--paper);padding:32px;border:1px solid var(--line);border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
input,textarea,select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
.title{font-size:1.6rem;font-weight:bold;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:4px 0;margin-bottom:20px}
table{width:100%;border-collapse:collapse;margin:8px 0}
th{text-align:left;font-size:.85rem;color:var(--muted);padding:6px 4px;border-bottom:2px solid var(--ink)}
td{padding:4px}
td.amt{text-align:right;white-space:nowrap;padding-right:8px}
.num{text-align:right}
.del{background:none;border:0;color:#b42318;font-size:1.2rem;cursor:pointer}
.add{background:none;border:1px dashed var(--accent);color:var(--accent);padding:8px 14px;border-radius:4px;cursor:pointer;font:inherit;margin:6px 0 20px}
.totals{margin-left:auto;width:min(320px,100%)}
.totals div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.totals .grand{border-top:2px solid var(--ink);font-size:1.3rem;font-weight:bold;margin-top:6px;padding-top:10px}
.totals input{width:90px;text-align:right}
.actions{max-width:820px;margin:0 auto 20px;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;padding:12px 22px;border-radius:4px;font:inherit;font-weight:bold;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
footer{max-width:820px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.85rem}
.print-only{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr}.sheet{padding:18px}}
@media print{
body{background:#fff}
header,.actions,footer,.add,.del,.noprint{display:none!important}
.sheet{border:0;margin:0;padding:0;max-width:none}
input,textarea,select{border:0!important;padding:2px 0;resize:none;appearance:none;-webkit-appearance:none}
.title{border-bottom:2px solid var(--ink)!important}
.print-only{display:inline}
}
</style>
</head>
<body>
<header>
<h1>Free Invoice Generator</h1>
<p>Fill in the details, then save as PDF. Nothing is uploaded, everything stays in your browser.</p>
</header>

<main class="sheet" id="sheet">
<input class="title" id="title" value="Invoice" aria-label="Document title">
<div class="row">
<div><label for="from">From (your name / business)</label><textarea id="from" placeholder="Your name&#10;Address&#10;Email"></textarea></div>
<div><label for="to">Bill to (client)</label><textarea id="to" placeholder="Client name&#10;Address&#10;Email"></textarea></div>
</div>
<div class="row">
<div><label for="num">Invoice number</label><input id="num" value="INV-001"></div>
<div><label for="cur">Currency symbol</label><input id="cur" value="$" maxlength="5"></div>
<div><label for="date">Invoice date</label><input id="date" type="date"></div>
<div><label for="due">Due date</label><input id="due" type="date"></div>
</div>

<table>
<thead><tr><th>Description</th><th class="num" style="width:80px">Qty</th><th class="num" style="width:110px">Price</th><th class="num" style="width:110px">Amount</th><th class="noprint" style="width:30px"></th></tr></thead>
<tbody id="items"></tbody>
</table>
<button class="add" onclick="addRow()">+ Add item</button>

<div class="totals">
<div><span>Subtotal</span><span id="sub">0.00</span></div>
<div><span>Tax (%)</span><input id="tax" type="number" min="0" step="0.1" value="0"></div>
<div><span>Discount</span><input id="disc" type="number" min="0" step="0.01" value="0"></div>
<div class="grand"><span>Total</span><span id="total">0.00</span></div>
</div>

<div style="margin-top:24px"><label for="notes">Notes / payment details</label><textarea id="notes" placeholder="Bank details, PayPal email, thank-you note..."></textarea></div>
</main>

<div class="actions">
<button class="btn" onclick="window.print()">Download PDF</button>
<button class="btn alt" onclick="reset()">Clear all</button>
</div>
<footer>Tip: in the print window choose "Save as PDF" as the destination.</footer>

<script>
var $=function(id){return document.getElementById(id)};
function n(v){return parseFloat(v)||0}
function money(v){return $('cur').value+v.toFixed(2)}
function addRow(d,q,p){
var tr=document.createElement('tr');
tr.innerHTML='<td><input class="d" placeholder="Service or product" value=""></td><td><input class="q num" type="number" min="0" step="any"></td><td><input class="p num" type="number" min="0" step="any"></td><td class="amt">0.00</td><td class="noprint"><button class="del" aria-label="Remove item">&times;</button></td>';
tr.querySelector('.d').value=d||'';
tr.querySelector('.q').value=q==null?1:q;
tr.querySelector('.p').value=p==null?'':p;
tr.querySelector('.del').onclick=function(){tr.remove();calc()};
tr.oninput=calc;
$('items').appendChild(tr);calc();
}
function calc(){
var sub=0;
document.querySelectorAll('#items tr').forEach(function(tr){
var a=n(tr.querySelector('.q').value)*n(tr.querySelector('.p').value);
sub+=a;tr.querySelector('.amt').textContent=money(a);
});
var t=sub*n($('tax').value)/100;
var total=Math.max(0,sub+t-n($('disc').value));
$('sub').textContent=money(sub);
$('total').textContent=money(total);
}
function reset(){
if(!confirm('Clear everything?'))return;
$('items').innerHTML='';
['from','to','notes'].forEach(function(i){$(i).value=''});
$('num').value='INV-001';$('tax').value=0;$('disc').value=0;
addRow();
}
['tax','disc','cur'].forEach(function(i){$(i).oninput=calc});
var today=new Date();
$('date').value=today.toISOString().slice(0,10);
var d2=new Date(today.getTime()+14*864e5);
$('due').value=d2.toISOString().slice(0,10);
addRow('',1,'');
</script>
</body>
</html>
